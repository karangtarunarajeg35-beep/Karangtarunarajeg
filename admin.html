<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin - Karang Taruna Rajeg</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          135deg,
          #071d49 0%,
          #123b80 55%,
          #f5c400 100%
        );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-area img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .logo-area h1 {
      font-size: 21px;
      line-height: 1.3;
      color: #071d49;
    }

    .logo-area p {
      margin-top: 8px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8dde7;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: .2s;
    }

    .form-group input:focus {
      border-color: #123b80;
      box-shadow: 0 0 0 3px rgba(18,59,128,.1);
    }

    .login-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #071d49;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .login-button:hover {
      background: #123b80;
    }

    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #ffcaca;
    }

    .message.success {
      display: block;
      background: #effbf3;
      color: #147a3e;
      border: 1px solid #bfe8ce;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #123b80;
      text-decoration: none;
      font-size: 13px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .checking {
      text-align: center;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="checking" class="checking">
    Memeriksa sesi...
  </div>

  <div id="loginBox" class="login-box" style="display:none;">

    <div class="logo-area">

      <img
        src="logo-karang-taruna2.webp"
        alt="Logo Karang Taruna"
        onerror="this.style.display='none'"
      >

      <h1>
        KARANG TARUNA<br>
        KECAMATAN RAJEG
      </h1>

      <p>
        Kabupaten Tangerang · Provinsi Banten<br>
        Panel Administrasi Website
      </p>

    </div>


    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Administrator
        </label>

        <input
          type="email"
          id="email"
          placeholder="Masukkan email"
          autocomplete="username"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Masuk ke Dashboard
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="back-link">

      <a href="index.html">
        ← Kembali ke Website
      </a>

    </div>

  </div>


<script>

  /* ==========================================
     SUPABASE CONFIG
     ========================================== */

  const SUPABASE_URL =
    "https://qemzczsltxbiyxsvpebv.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_AngscFwHvEYlm4oPa-vhVA_DkvBSJmm";


  /* ==========================================
     SUPABASE CLIENT
     ========================================== */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );


  const checking =
    document.getElementById("checking");

  const loginBox =
    document.getElementById("loginBox");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");


  /* ==========================================
     MESSAGE
     ========================================== */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  /* ==========================================
     CHECK SESSION SAAT HALAMAN DIBUKA
     ========================================== */

  async function checkExistingSession() {

    try {

      const {
        data,
        error
      } =
      await supabaseClient.auth.getSession();


      if (error) {

        console.error(error);

        showLogin();

        return;

      }


      if (data && data.session) {

        /*
          Jangan langsung percaya session.
          Kita cek profile admin dulu.
        */

        const user =
          data.session.user;


        const {
          data: profile,
          error: profileError
        } =
        await supabaseClient
          .from("profiles")
          .select("id, full_name, role")
          .eq("id", user.id)
          .maybeSingle();


        if (
          !profileError &&
          profile &&
          (
            profile.role === "admin" ||
            profile.role === "editor"
          )
        ) {

          window.location.replace(
            "admin-dashboard.html"
          );

          return;

        }


        /*
          Session ada tapi bukan admin.
          Bersihkan session.
        */

        await supabaseClient.auth.signOut();

      }


      showLogin();

    }

    catch (error) {

      console.error(error);

      showLogin();

    }

  }


  /* ==========================================
     TAMPILKAN FORM LOGIN
     ========================================== */

  function showLogin() {

    checking.style.display = "none";

    loginBox.style.display = "block";

  }


  /* ==========================================
     LOGIN
     ========================================== */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;


      if (!email || !password) {

        showMessage(
          "Email dan password wajib diisi.",
          "error"
        );

        return;

      }


      loginButton.disabled = true;

      loginButton.textContent =
        "Memproses login...";


      message.className =
        "message";


      try {

        /*
          LOGIN SUPABASE
        */

        const {
          data,
          error
        } =
        await supabaseClient.auth
          .signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          throw new Error(
            "Login gagal: " +
            error.message
          );

        }


        if (!data.session || !data.user) {

          throw new Error(
            "Session login tidak berhasil dibuat."
          );

        }


        /*
          CEK PROFILE
        */

        const {
          data: profile,
          error: profileError
        } =
        await supabaseClient
          .from("profiles")
          .select(
            "id, full_name, role"
          )
          .eq("id", data.user.id)
          .maybeSingle();


        if (profileError) {

          throw new Error(
            "Login berhasil, tetapi profil admin tidak dapat dibaca: " +
            profileError.message
          );

        }


        if (!profile) {

          throw new Error(
            "Akun berhasil login, tetapi belum terdaftar sebagai administrator di tabel profiles."
          );

        }


        if (
          profile.role !== "admin" &&
          profile.role !== "editor"
        ) {

          throw new Error(
            "Akun ini tidak mempunyai hak akses administrator."
          );

        }


        /*
          SEMUA VALID
          MASUK DASHBOARD
        */

        showMessage(
          "Login berhasil. Membuka dashboard...",
          "success"
        );


        setTimeout(
          function() {

            window.location.replace(
              "admin-dashboard.html"
            );

          },
          400
        );

      }

      catch (error) {

        console.error(error);

        showMessage(
          error.message,
          "error"
        );


        /*
          Kalau login gagal,
          pastikan session dibersihkan.
        */

        try {

          await supabaseClient.auth.signOut();

        }

        catch (e) {

          console.error(e);

        }

      }


      finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "Masuk ke Dashboard";

      }

    }
  );


  /* ==========================================
     JALANKAN
     ========================================== */

  checkExistingSession();

</script>

</body>
</html>
