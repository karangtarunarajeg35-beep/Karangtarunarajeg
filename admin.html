<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin — Karang Taruna Rajeg</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 204, 0, .18), transparent 35%),
        linear-gradient(135deg, #071a3d 0%, #0d2857 55%, #061633 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #17233d;
    }

    .login-wrapper {
      width: 100%;
      max-width: 1000px;
      min-height: 600px;
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      box-shadow: 0 30px 80px rgba(0,0,0,.28);
    }

    .brand-panel {
      position: relative;
      background: linear-gradient(160deg, #ffcc00, #f4b900);
      padding: 55px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,.13);
      top: -100px;
      right: -100px;
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(7,26,61,.08);
      bottom: -100px;
      left: -70px;
    }

    .brand-content {
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 125px;
      height: 125px;
      object-fit: contain;
      background: #fff;
      border-radius: 24px;
      padding: 12px;
      margin-bottom: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,.12);
    }

    .brand-panel h1 {
      font-size: 34px;
      line-height: 1.15;
      color: #071a3d;
      margin-bottom: 16px;
      font-weight: 800;
    }

    .brand-panel p {
      color: #253b61;
      line-height: 1.7;
      font-size: 15px;
      max-width: 410px;
    }

    .brand-badge {
      display: inline-flex;
      width: fit-content;
      margin-top: 25px;
      background: #071a3d;
      color: #fff;
      padding: 9px 15px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .form-panel {
      padding: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .form-box {
      width: 100%;
      max-width: 400px;
    }

    .form-box h2 {
      font-size: 30px;
      color: #071a3d;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .subtitle {
      color: #758198;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #263653;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      height: 52px;
      border: 1px solid #dce2eb;
      border-radius: 13px;
      padding: 0 48px 0 16px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: .2s;
      color: #17233d;
      background: #fff;
    }

    .input-wrap input:focus {
      border-color: #ffcc00;
      box-shadow: 0 0 0 4px rgba(255,204,0,.15);
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #68758c;
      font-size: 13px;
      font-weight: 700;
    }

    .login-button {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 13px;
      background: #071a3d;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #0d2857;
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a52525;
      border: 1px solid #ffd0d0;
    }

    .message.success {
      display: block;
      background: #eefaf2;
      color: #20733b;
      border: 1px solid #ccefd6;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #68758c;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .back-link:hover {
      color: #071a3d;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 800px) {
      .login-wrapper {
        grid-template-columns: 1fr;
        max-width: 520px;
      }

      .brand-panel {
        padding: 38px;
        min-height: 320px;
      }

      .brand-panel h1 {
        font-size: 28px;
      }

      .logo {
        width: 90px;
        height: 90px;
        margin-bottom: 20px;
      }

      .form-panel {
        padding: 38px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-wrapper {
        border-radius: 20px;
      }

      .brand-panel,
      .form-panel {
        padding: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <section class="brand-panel">
      <div class="brand-content">

        <img
          src="logo-karang-taruna2.webp"
          alt="Logo Karang Taruna Rajeg"
          class="logo"
        >

        <h1>
          Admin<br>
          Karang Taruna Rajeg
        </h1>

        <p>
          Selamat datang di panel administrasi
          Karang Taruna Kecamatan Rajeg.
          Kelola berita, kegiatan, pengumuman,
          dokumentasi, jurnal, prestasi, dan profil pengurus.
        </p>

        <span class="brand-badge">
          KABUPATEN TANGERANG • BANTEN
        </span>

      </div>
    </section>


    <section class="form-panel">

      <div class="form-box">

        <h2>Masuk Admin</h2>

        <p class="subtitle">
          Silakan masuk menggunakan akun administrator.
        </p>

        <form id="loginForm">

          <div class="field">
            <label for="email">Email</label>

            <div class="input-wrap">
              <input
                type="email"
                id="email"
                placeholder="Masukkan email admin"
                autocomplete="username"
                required
              >
            </div>
          </div>


          <div class="field">
            <label for="password">Password</label>

            <div class="input-wrap">

              <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
              >
                Lihat
              </button>

            </div>
          </div>


          <button
            type="submit"
            class="login-button"
            id="loginButton"
          >
            Masuk ke Dashboard
          </button>

        </form>


        <div
          id="message"
          class="message"
        ></div>


        <a
          href="index.html"
          class="back-link"
        >
          ← Kembali ke Website
        </a>

      </div>

    </section>

  </div>


  <script>

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");


    function showMessage(text, type = "error") {

      messageBox.textContent = text;

      messageBox.className = "message " + type;

    }


    function clearMessage() {

      messageBox.textContent = "";

      messageBox.className = "message";

    }


    togglePassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        togglePassword.textContent = "Sembunyikan";

      } else {

        passwordInput.type = "password";

        togglePassword.textContent = "Lihat";

      }

    });


    async function checkExistingSession() {

      try {

        const {
          data: {
            session
          },
          error
        } = await supabase.auth.getSession();


        if (error) {

          console.error("SESSION ERROR:", error);

          return;

        }


        if (session) {

          window.location.href = "admin-dashboard.html";

        }

      } catch (error) {

        console.error("CHECK SESSION ERROR:", error);

      }

    }


    loginForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      clearMessage();


      const email = emailInput.value.trim();

      const password = passwordInput.value;


      if (!email || !password) {

        showMessage("Email dan password wajib diisi.");

        return;

      }


      loginButton.disabled = true;

      loginButton.innerHTML = `
        <span class="loading">
          <span class="spinner"></span>
          Memproses login...
        </span>
      `;


      try {

        console.log("Mencoba login:", email);


        const {
          data,
          error
        } = await supabase.auth.signInWithPassword({

          email: email,

          password: password

        });


        console.log("Supabase login response:", data, error);


        if (error) {

          console.error("SUPABASE LOGIN ERROR:", error);

          showMessage(
            "Login gagal: " +
            (error.message || "Kesalahan tidak diketahui.")
          );

          return;

        }


        if (!data || !data.user) {

          showMessage(
            "Login gagal: Supabase tidak mengembalikan data user."
          );

          return;

        }


        console.log("User berhasil login:", data.user.id);


        /*
         * CEK PROFILE ADMIN
         */

        const {
          data: profile,
          error: profileError
        } = await supabase

          .from("profiles")

          .select("id, full_name, role")

          .eq("id", data.user.id)

          .maybeSingle();


        console.log(
          "Profile:",
          profile,
          "Profile error:",
          profileError
        );


        if (profileError) {

          await supabase.auth.signOut();

          showMessage(
            "Login berhasil, tetapi profil admin gagal dibaca: " +
            profileError.message
          );

          return;

        }


        if (!profile) {

          await supabase.auth.signOut();

          showMessage(
            "Akun berhasil login, tetapi belum memiliki data profil admin di tabel profiles."
          );

          return;

        }


        if (
          profile.role !== "admin" &&
          profile.role !== "editor"
        ) {

          await supabase.auth.signOut();

          showMessage(
            "Akun ini tidak memiliki akses administrator."
          );

          return;

        }


        /*
         * SEMUA AMAN
         */

        showMessage(
          "Login berhasil. Membuka dashboard...",
          "success"
        );


        setTimeout(function () {

          window.location.href = "admin-dashboard.html";

        }, 500);


      } catch (error) {

        console.error("LOGIN EXCEPTION:", error);


        showMessage(
          "Terjadi kesalahan: " +
          (
            error?.message ||
            "Tidak dapat terhubung ke Supabase."
          )
        );


      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "Masuk ke Dashboard";

      }

    });


    /*
     * CEK SESSION SAAT HALAMAN DIBUKA
     */

    checkExistingSession();

  </script>

</body>
</html>
